<div class="container-fluid vh-100">
  <div class="row h-100 justify-content-center align-items-center">

    <div class="col-md-4">

      <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-5">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Login</h2>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group mb-3">
              <label class="form-label">Username1</label>
              <input type="text" class="form-control form-control-lg" placeholder="Enter username" formControlName="email">
            </div>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger mb-3">
              Username is required.
              </div>

            <div class="form-group mb-4">
              <label class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" placeholder="Enter password" formControlName="password">
            </div>
             <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger mb-3">
              Password is required.
              </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">
              Login
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>
</div>
