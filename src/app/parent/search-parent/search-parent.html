<div class="modal fade" id="parentSearchModal" tabindex="-1">

  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Parent Search</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="parentSearchForm" (ngSubmit)="searchParents()">
          <!-- SEARCH -->
          <div class="row mb-3">

            <div class="col-md-3">
              <label>Full Name</label>
              <input class="form-control" formControlName="fullName" [formGroup]="parentSearchForm">
            </div>

            <div class="col-md-3">
              <label>Email</label>
              <input class="form-control" formControlName="email" [formGroup]="parentSearchForm">
            </div>

            <div class="col-md-3">
              <label>Mobile No</label>
              <input class="form-control" formControlName="mobileNo" [formGroup]="parentSearchForm">
            </div>

            <div class="col-md-3">
              <label>Address</label>
              <input class="form-control" formControlName="address" [formGroup]="parentSearchForm">
            </div>
          </div>
          <div class="row m-3 align-items-center justify-content-center">
            <div class="col-md-2">
              <button class="btn btn-primary w-100" type="submit">
                search
                <i class="bi bi-search"></i>
              </button>
            </div>
            <div class="col-md-2">
              <button class="btn btn-secondary w-100" type="button" (click)="clearSearch()">
                Clear
              </button>
            </div>
          </div>
        </form>

        <div *ngIf="loading" class="text-center my-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Loading...</p>
        </div>
        <!-- TABLE -->
        <table class="table table-bordered" *ngIf="!loading">
          <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Mobile No</th>
              <th>Address</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let p of parents">
              <td>{{p.id}}</td>
              <td>{{p.fullName}}</td>
              <td>{{p.email}}</td>
              <td>{{p.mobileNo}}</td>
              <td>{{p.address}}</td>
              <td>
                <button class="btn btn-success btn-sm" (click)="selectParent(p)">
                  Select
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- PAGINATION -->
        <div class="d-flex justify-content-between">
          <button class="btn btn-secondary" (click)="previousPage()">Prev</button>
          <button class="btn btn-secondary" (click)="nextPage()">Next</button>
        </div>

      </div>

    </div>
  </div>

</div>
