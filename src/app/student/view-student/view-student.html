<div class="container mt-4">

    <div class="card">
        <div class="card-header">
            <h3>View Student</h3>
        </div>

        <div class="card-body">
            <form [formGroup]="studentForm" >
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">Admission No</label>
                            <input type="text" readonly class="form-control" formControlName="admissionNo">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" formControlName="firstName" readonly>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" formControlName="lastName" readonly>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">Gender</label>
                            <select class="form-select" formControlName="gender">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">Class</label>
                            <input type="text" class="form-control" formControlName="className">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3 form-group">
                            <label class="form-label">Section</label>
                            <input type="text" class="form-control" formControlName="sectionName">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">

                        <div class="mb-3 form-group">
                            <label class="form-label">Status</label>
                            <!--        <input type="text" class="form-control" formControlName="status"> -->
                            <select id="status" class="form-select" formControlName="status">

                                <option value="">-- Select Status --</option>
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3 form-group">
                                    <label class="form-label">Parent Name</label>
                                    <input type="text" class="form-control" formControlName="fullName" readonly>

                                </div>
                            </div>

                            <div class="col-md-6 d-flex align-items-end p-0 ">
                                <div class="mb-3 form-group"> <button type="button" class="btn btn-primary"
                                        data-bs-toggle="modal" data-bs-target="#parentSearchModal">

                                        <i class="bi bi-search"></i>

                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>


                <button class="btn btn-success" (click)="addInvoice()" >
                    <i class="bi bi-pencil-square"></i> Add Invoice
                </button>


                <button class="btn btn-secondary ms-2" routerLink="/students">
                    Cancel
                </button>

            </form>

        </div>
    </div>
    <div class="card">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Invoice Number</th>
                    <th>Invoice Date</th>
                    <th>Due Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let invoice of invoices">
                    <td><a [routerLink]="['/invoices/view', invoice.invoiceID]">{{ invoice.invoiceNumber }}</a></td>
                    <td>{{ invoice.invoiceDate | date }}</td>
                    <td>{{ invoice.dueDate | date }}</td>
                    <td>{{ invoice.amount }}</td>
                    <td>{{ invoice.status }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
